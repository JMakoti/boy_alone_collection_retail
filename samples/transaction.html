<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Lipa Mdogo | Transaction Hub - Success Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 100%);
      }
      .scrollbar-custom::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-custom::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .scrollbar-custom::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hover-scale {
        transition: all 0.2s ease;
      }
      .hover-scale:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.15);
      }
      @media (max-width: 1024px) {
        .sidebar-mobile {
          transform: translateX(-100%);
          position: fixed;
          z-index: 50;
          transition: 0.3s;
        }
        .sidebar-mobile.open {
          transform: translateX(0);
        }
      }
      .tab-active {
        border-bottom: 2px solid #059669;
        color: #059669;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="antialiased">
    <button
      id="mobileMenuBtn"
      class="lg:hidden fixed top-4 left-4 z-50 bg-emerald-700 text-white p-2.5 rounded-xl shadow-lg"
    >
      <i class="fas fa-bars text-xl"></i>
    </button>
    <div class="flex min-h-screen relative">
      <aside
        id="sidebar"

            </div>
            <div>

                Enterprise Admin Suite v2.0
              </p>
            </div>
          </div>
        </div>
        <nav class="p-4 space-y-1.5">
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="dashboard"
          >
            <i class="fas fa-chart-line w-5 text-lg"></i
            ><span>Executive Dashboard</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="catalog"
          >
            <i class="fas fa-tags w-5 text-lg"></i><span>Product Catalog</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="inventory"
          >
            <i class="fas fa-boxes w-5 text-lg"></i
            ><span>Inventory Intelligence</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="orders"
          >
            <i class="fas fa-tasks w-5 text-lg"></i><span>Order Pipeline</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="customers"
          >
            <i class="fas fa-users w-5 text-lg"></i><span>Customer Hub</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all bg-emerald-50 text-emerald-700 font-semibold"
            data-tab="transactions"
          >
            <i class="fas fa-usd w-5 text-lg"></i><span>Transaction Hub</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="installments"
          >
            <i class="fas fa-hand-holding-usd w-5 text-lg"></i
            ><span>Lipa Mdogo Core</span>
          </div>
          <div
            class="nav-item cursor-pointer flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
            data-tab="analytics"
          >
            <i class="fas fa-chart-pie w-5 text-lg"></i
            ><span>Analytics Engine</span>
          </div>
        </nav>
        <div

        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 bg-gradient-to-r from-emerald-100 to-teal-100 rounded-full flex items-center justify-center"
            >
              <i class="fas fa-user-shield text-emerald-700"></i>
            </div>
            <div class="flex-1">
              <p class="text-sm font-bold text-gray-800">Store Manager</p>
              <p class="text-xs text-gray-500">Role: Admin · Full Access</p>
            </div>
            <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
          </div>
        </div>
      </aside>

      <main class="flex-1 lg:ml-0 min-h-screen">
        <div id="pageRenderer" class="p-4 lg:p-8 fade-in"></div>
      </main>
    </div>

    <!-- Manual Transaction Modal (New Design) -->
    <div
      id="manualTransactionModal"
      class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8"
    >
      <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 shadow-2xl">
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-5 rounded-t-2xl flex justify-between items-center"
        >
          <h3 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-plus-circle text-emerald-600 mr-2"></i>Add New
            Transaction
          </h3>
          <button
            id="closeManualModal"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="manualTransactionForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Reference Code <span class="text-red-500">*</span></label
                ><input
                  type="text"
                  id="transRefCode"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"
                  placeholder="e.g., INV-001 / TRX-001"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Payment Method <span class="text-red-500">*</span></label
                ><select
                  id="transPaymentMethod"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="M-Pesa">M-Pesa</option>
                  <option value="Cash">Cash</option>
                  <option value="Airtel Money">Airtel Money</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Transaction Code</label
                ><input
                  type="text"
                  id="transCode"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Optional: M-Pesa ref / Cheque no."
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Amount (KES) <span class="text-red-500">*</span></label
                ><input
                  type="number"
                  id="transAmount"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="0.00"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Status <span class="text-red-500">*</span></label
                ><select
                  id="transStatus"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="Success">Success</option>
                  <option value="Pending">Pending</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Order</label
                ><select
                  id="transOrder"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="">-- Select Order --</option>
                  <option value="ORD-12847">ORD-12847 - Sarah Mwangi</option>
                  <option value="ORD-12846">ORD-12846 - John Kamau</option>
                  <option value="ORD-12845">ORD-12845 - Grace Njeri</option>
                  <option value="ORD-12844">ORD-12844 - Peter Omondi</option>
                  <option value="ORD-12843">ORD-12843 - Mary Wanjiku</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Notes</label
                ><textarea
                  id="transNotes"
                  rows="2"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Additional information"
                ></textarea>
              </div>
            </div>
            <div class="flex gap-3 justify-end pt-4">
              <button
                type="button"
                id="cancelManualBtn"
                class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 font-medium"
              >
                Cancel</button
              ><button
                type="submit"
                class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl hover:shadow-lg font-medium"
              >
                <i class="fas fa-check-circle mr-2"></i>Add Transaction
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Expense Modal -->
    <div
      id="expenseModal"
      class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8"
    >
      <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 shadow-2xl">
        <div class="px-6 py-5 border-b flex justify-between items-center">
          <h3 class="text-2xl font-bold">
            <i class="fas fa-chart-line text-red-600 mr-2"></i>Record Expense
          </h3>
          <button id="closeExpenseModal" class="text-gray-400">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="expenseForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="text-sm font-semibold">Expense Category *</label
                ><select
                  id="expenseCategory"
                  class="w-full p-2.5 border rounded-xl"
                >
                  <option>Rent</option>
                  <option>Utilities</option>
                  <option>Inventory Purchase</option>
                  <option>Salary</option>
                  <option>Marketing</option>
                </select>
              </div>
              <div>
                <label>Amount (KES) *</label
                ><input
                  type="number"
                  id="expenseAmount"
                  required
                  class="w-full p-2.5 border rounded-xl"
                />
              </div>
              <div>
                <label>Date *</label
                ><input
                  type="date"
                  id="expenseDate"
                  class="w-full p-2.5 border rounded-xl"
                />
              </div>
              <div>
                <label>Payment Method</label
                ><select
                  id="expenseMethod"
                  class="w-full p-2.5 border rounded-xl"
                >
                  <option>Bank Transfer</option>
                  <option>Cash</option>
                  <option>M-Pesa</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label>Description</label
                ><textarea
                  id="expenseDesc"
                  rows="2"
                  class="w-full p-2.5 border rounded-xl"
                ></textarea>
              </div>
            </div>
            <div class="flex gap-3 justify-end">
              <button
                type="button"
                id="cancelExpenseBtn"
                class="px-6 py-2.5 border rounded-xl"
              >
                Cancel</button
              ><button
                type="submit"
                class="px-6 py-2.5 bg-red-600 text-white rounded-xl"
              >
                Add Expense
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      let activeTab = "transactions";

      // SUCCESS TRANSACTIONS TABLE DATA
      let successTransactions = [
        {
          id: "TXN-001",
          refCode: "INV-1001",
          paymentMethod: "M-Pesa",
          transCode: "QWK2L3M4",
          amount: 2075,
          status: "Success",
          orderId: "ORD-12847",
          customer: "Sarah Mwangi",
          date: "2026-04-11",
          notes: "Monthly installment",
        },
        {
          id: "TXN-002",
          refCode: "INV-1002",
          paymentMethod: "Cash",
          transCode: "",
          amount: 6500,
          status: "Success",
          orderId: "ORD-12846",
          customer: "John Kamau",
          date: "2026-04-10",
          notes: "Full payment",
        },
        {
          id: "TXN-003",
          refCode: "INV-1003",
          paymentMethod: "M-Pesa",
          transCode: "RTY9U7I6",
          amount: 1575,
          status: "Success",
          orderId: "ORD-12845",
          customer: "Grace Njeri",
          date: "2026-04-09",
          notes: "Installment #2",
        },
        {
          id: "TXN-004",
          refCode: "INV-1004",
          paymentMethod: "Airtel Money",
          transCode: "AIR123456",
          amount: 1689,
          status: "Success",
          orderId: "ORD-12843",
          customer: "Mary Wanjiku",
          date: "2026-04-08",
          notes: "Monthly payment",
        },
        {
          id: "TXN-005",
          refCode: "INV-1005",
          paymentMethod: "M-Pesa",
          transCode: "MPESA78JK",
          amount: 1083,
          status: "Success",
          orderId: "ORD-12789",
          customer: "Peter Omondi",
          date: "2026-04-05",
          notes: "Late payment",
        },
        {
          id: "TXN-006",
          refCode: "INV-1006",
          paymentMethod: "Bank Transfer",
          transCode: "BT98765",
          amount: 12500,
          status: "Success",
          orderId: "ORD-12844",
          customer: "Peter Omondi",
          date: "2026-04-12",
          notes: "Bulk order payment",
        },
      ];

      let expensesList = [
        {
          id: "EXP-001",
          category: "Rent",
          amount: 50000,
          date: "2026-04-01",
          method: "Bank Transfer",
          description: "April rent",
        },
        {
          id: "EXP-002",
          category: "Utilities",
          amount: 12500,
          date: "2026-04-05",
          method: "M-Pesa",
          description: "Electricity & water",
        },
      ];

      function generateTransactionId() {
        return `TXN-${String(successTransactions.length + 101).padStart(3, "0")}`;
      }

      // Calculate KPIs based on transactions
      function calculateKPIs() {
        const totalTransactions = successTransactions.length;
        const totalCollected = successTransactions.reduce(
          (sum, t) => sum + t.amount,
          0,
        );
        const totalExpenses = expensesList.reduce(
          (sum, e) => sum + e.amount,
          0,
        );
        const netIncome = totalCollected - totalExpenses;
        const avgTransaction =
          totalTransactions > 0 ? totalCollected / totalTransactions : 0;
        // Count by payment method
        const mpesaCount = successTransactions.filter(
          (t) => t.paymentMethod === "M-Pesa",
        ).length;
        const cashCount = successTransactions.filter(
          (t) => t.paymentMethod === "Cash",
        ).length;
        const bankCount = successTransactions.filter(
          (t) => t.paymentMethod === "Bank Transfer",
        ).length;
        const airtelCount = successTransactions.filter(
          (t) => t.paymentMethod === "Airtel Money",
        ).length;

        return {
          totalTransactions,
          totalCollected,
          totalExpenses,
          netIncome,
          avgTransaction,
          mpesaCount,
          cashCount,
          bankCount,
          airtelCount,
        };
      }

      // Render Transaction Hub with Success Transactions Table - NO COLLECTIONS TAB
      function renderTransactionHub() {
        const kpis = calculateKPIs();

        return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div><h1 class="text-3xl font-bold text-gray-800">Transaction Hub</h1><p class="text-gray-500 mt-1">Manage success transactions & expenses</p></div>
            <div class="flex gap-2"><button id="manualTransBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-5 py-2.5 rounded-xl hover:shadow-lg flex items-center gap-2"><i class="fas fa-plus-circle"></i> New Transaction</button><button id="addExpenseBtn" class="bg-red-600 text-white px-5 py-2.5 rounded-xl hover:bg-red-700 flex items-center gap-2"><i class="fas fa-chart-line"></i> Add Expense</button></div>
          </div>
          
          <!-- KPIs focused on transactions -->
          <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-emerald-600 mb-2"><i class="fas fa-check-circle"></i><p class="text-sm font-medium">Total Transactions</p></div><p class="text-2xl font-semibold">${kpis.totalTransactions}</p></div>
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-blue-600 mb-2"><i class="fas fa-dollar-sign"></i><p class="text-sm font-medium">Total Collected</p></div><p class="text-2xl font-semibold">KES ${(kpis.totalCollected / 1000).toFixed(1)}K</p></div>
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-red-600 mb-2"><i class="fas fa-chart-line"></i><p class="text-sm font-medium">Total Expenses</p></div><p class="text-2xl font-semibold">KES ${(kpis.totalExpenses / 1000).toFixed(1)}K</p></div>
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-purple-600 mb-2"><i class="fas fa-chart-simple"></i><p class="text-sm font-medium">Net Income</p></div><p class="text-2xl font-semibold">KES ${(kpis.netIncome / 1000).toFixed(1)}K</p></div>
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-amber-600 mb-2"><i class="fas fa-receipt"></i><p class="text-sm font-medium">Avg Transaction</p></div><p class="text-2xl font-semibold">KES ${Math.round(kpis.avgTransaction).toLocaleString()}</p></div>
          </div>
          
          <!-- Secondary KPIs: Payment method breakdown -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-gradient-to-r from-green-50 to-green-100 rounded-xl p-3 border border-green-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-green-700"><i class="fab fa-m-pesa mr-1"></i> M-Pesa</span><span class="text-xl font-bold text-green-800">${kpis.mpesaCount}</span></div><p class="text-xs text-green-600 mt-1">transactions</p></div>
            <div class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl p-3 border border-gray-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-gray-700"><i class="fas fa-money-bill-wave mr-1"></i> Cash</span><span class="text-xl font-bold text-gray-800">${kpis.cashCount}</span></div><p class="text-xs text-gray-600">transactions</p></div>
            <div class="bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl p-3 border border-blue-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-blue-700"><i class="fas fa-university mr-1"></i> Bank Transfer</span><span class="text-xl font-bold text-blue-800">${kpis.bankCount}</span></div><p class="text-xs text-blue-600">transactions</p></div>
            <div class="bg-gradient-to-r from-purple-50 to-purple-100 rounded-xl p-3 border border-purple-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-purple-700"><i class="fas fa-mobile-alt mr-1"></i> Airtel Money</span><span class="text-xl font-bold text-purple-800">${kpis.airtelCount}</span></div><p class="text-xs text-purple-600">transactions</p></div>
          </div>
          
          <!-- Tabs: Success Transactions, Expenses (removed Collections Dashboard) -->
          <div class="border-b border-gray-200 flex gap-6">
            <button class="tab-btn pb-3 px-1 text-emerald-600 border-b-2 border-emerald-600 font-medium" data-tab="transactions">Success Transactions</button>
            <button class="tab-btn pb-3 px-1 text-gray-500 hover:text-gray-700" data-tab="expenses">Expenses</button>
          </div>
          <div id="tabContentContainer"></div>
        </div>
      `;
      }

      // Success Transactions Table
      function renderTransactionsTab() {
        const kpis = calculateKPIs();
        return `
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Ref Code</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Payment Method</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Trans Code</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Amount</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Status</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Order</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Customer</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Date</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                ${successTransactions
                  .map(
                    (txn) => `
                  <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 font-medium text-gray-800">${txn.refCode}</td>
                    <td class="px-6 py-4"><span class="inline-flex px-2 py-1 bg-gray-100 rounded-lg text-xs">${txn.paymentMethod}</span></td>
                    <td class="px-6 py-4 text-gray-500 text-sm">${txn.transCode || "—"}</td>
                    <td class="px-6 py-4 font-semibold text-emerald-700">KES ${txn.amount.toLocaleString()}</td>
                    <td class="px-6 py-4"><span class="inline-flex px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700"><i class="fas fa-check-circle mr-1 text-xs"></i>${txn.status}</span></td>
                    <td class="px-6 py-4 text-gray-600 text-sm">${txn.orderId}</td>
                    <td class="px-6 py-4 text-gray-700">${txn.customer}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${new Date(txn.date).toLocaleDateString()}</td>
                    <td class="px-6 py-4"><button class="deleteTxnBtn text-red-500 hover:text-red-700" data-id="${txn.id}"><i class="fas fa-trash-alt"></i></button></td>
                  </tr>
                `,
                  )
                  .join("")}
                ${successTransactions.length === 0 ? '<tr><td colspan="9" class="text-center py-8 text-gray-400">No transactions recorded yet. Click "New Transaction" to add.</td></tr>' : ""}
              </tbody>
            </table>
          </div>
          <div class="bg-gray-50 px-6 py-3 border-t text-sm text-gray-500 flex justify-between items-center">
            <span><i class="fas fa-database mr-1"></i> ${successTransactions.length} successful transactions | Total: KES ${kpis.totalCollected.toLocaleString()}</span>
            <button id="exportTransactionsBtn" class="text-emerald-600 hover:text-emerald-700"><i class="fas fa-download mr-1"></i> Export CSV</button>
          </div>
        </div>
      `;
      }

      function renderExpensesTab() {
        const totalExp = expensesList.reduce((s, e) => s + e.amount, 0);
        return `<div class="space-y-4"><div class="flex justify-between items-center"><h3 class="font-semibold text-lg">Expense History</h3><span class="text-red-600 font-bold">Total: KES ${totalExp.toLocaleString()}</span></div><div class="bg-white border rounded-xl overflow-hidden"><table class="w-full"><thead class="bg-gray-50"><tr><th class="p-3 text-left">Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Method</th><th></th></tr></thead><tbody>${expensesList.map((exp) => `<tr class="border-t"><td class="p-3">${new Date(exp.date).toLocaleDateString()}</td><td class="p-3"><span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs">${exp.category}</span></td><td class="p-3 text-gray-600">${exp.description}</td><td class="p-3 font-semibold text-red-600">KES ${exp.amount.toLocaleString()}</td><td class="p-3 text-gray-500">${exp.method}</td><td class="p-3"><button class="deleteExpenseBtn text-red-500" data-id="${exp.id}"><i class="fas fa-trash"></i></button></td></tr>`).join("")}</tbody></table></div><button id="quickExpenseBtn" class="bg-red-600 text-white px-4 py-2 rounded-xl w-full mt-2"><i class="fas fa-plus"></i> Quick Add Expense</button></div>`;
      }

      function switchTab(tabId) {
        const container = document.getElementById("tabContentContainer");
        if (tabId === "transactions")
          container.innerHTML = renderTransactionsTab();
        else if (tabId === "expenses")
          container.innerHTML = renderExpensesTab();
        attachTabSpecificEvents(tabId);
      }

      function attachTabSpecificEvents(tabId) {
        if (tabId === "transactions") {
          document.querySelectorAll(".deleteTxnBtn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const id = btn.dataset.id;
              if (confirm("Delete this transaction?")) {
                successTransactions = successTransactions.filter(
                  (t) => t.id !== id,
                );
                renderCurrentTab();
              }
            });
          });
          document
            .getElementById("exportTransactionsBtn")
            ?.addEventListener("click", () => {
              let csv =
                "Ref Code,Payment Method,Trans Code,Amount,Status,Order,Customer,Date,Notes\n" +
                successTransactions
                  .map(
                    (t) =>
                      `${t.refCode},${t.paymentMethod},${t.transCode || ""},${t.amount},${t.status},${t.orderId},${t.customer},${t.date},${t.notes || ""}`,
                  )
                  .join("\n");
              const blob = new Blob([csv], { type: "text/csv" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "transactions.csv";
              a.click();
              URL.revokeObjectURL(url);
            });
        }
        if (tabId === "expenses") {
          document.querySelectorAll(".deleteExpenseBtn").forEach((btn) =>
            btn.addEventListener("click", (e) => {
              const id = btn.dataset.id;
              if (confirm("Delete expense?")) {
                expensesList = expensesList.filter((e) => e.id !== id);
                renderCurrentTab();
              }
            }),
          );
          document
            .getElementById("quickExpenseBtn")
            ?.addEventListener("click", () =>
              document
                .getElementById("expenseModal")
                .classList.remove("hidden"),
            );
        }
      }

      function renderCurrentTab() {
        const container = document.getElementById("pageRenderer");
        if (activeTab === "transactions") {
          container.innerHTML = renderTransactionHub();
          document
            .getElementById("manualTransBtn")
            ?.addEventListener("click", () =>
              document
                .getElementById("manualTransactionModal")
                .classList.remove("hidden"),
            );
          document
            .getElementById("addExpenseBtn")
            ?.addEventListener("click", () =>
              document
                .getElementById("expenseModal")
                .classList.remove("hidden"),
            );
          const tabBtns = document.querySelectorAll(".tab-btn");
          tabBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              tabBtns.forEach((b) =>
                b.classList.remove(
                  "text-emerald-600",
                  "border-emerald-600",
                  "font-medium",
                ),
              );
              btn.classList.add(
                "text-emerald-600",
                "border-b-2",
                "border-emerald-600",
                "font-medium",
              );
              switchTab(btn.dataset.tab);
            });
          });
          switchTab("transactions");
        } else if (activeTab === "dashboard")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Executive Dashboard</h2><p class="text-gray-500 mt-2">Welcome to the admin suite.</p></div>`;
        else if (activeTab === "catalog")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Product Catalog</h2><button id="addProductBtn" class="bg-emerald-600 text-white px-4 py-2 rounded-xl mt-4">Add Product</button></div>`;
        else if (activeTab === "inventory")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Inventory Intelligence</h2><div class="grid grid-cols-2 gap-4 mt-4"><div class="p-4 bg-gray-50 rounded-xl">Denim Jacket: 45 units</div><div class="p-4 bg-gray-50 rounded-xl">Summer Dress: 28 units</div></div></div>`;
        else if (activeTab === "orders")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Order Pipeline</h2><p>Order management coming soon.</p></div>`;
        else if (activeTab === "customers")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Customer Hub</h2><p>Customer 360° view.</p></div>`;
        else if (activeTab === "installments")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Lipa Mdogo Core</h2><p>Installment payment plans management.</p></div>`;
        else if (activeTab === "analytics")
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl"><h2 class="text-2xl font-bold">Analytics Engine</h2><canvas id="dummyChart" height="200"></canvas><script>setTimeout(()=>{const ctx=document.getElementById('dummyChart')?.getContext('2d');if(ctx)new Chart(ctx,{type:'line',data:{labels:['Jan','Feb','Mar'],datasets:[{data:[120,145,178]}]}});},100);<\/script></div>`;
        attachCommonEvents();
      }

      function attachCommonEvents() {
        document
          .getElementById("addProductBtn")
          ?.addEventListener("click", () => alert("Add product functionality"));
        // Manual Transaction Modal events
        document
          .getElementById("closeManualModal")
          ?.addEventListener("click", () =>
            document
              .getElementById("manualTransactionModal")
              .classList.add("hidden"),
          );
        document
          .getElementById("cancelManualBtn")
          ?.addEventListener("click", () =>
            document
              .getElementById("manualTransactionModal")
              .classList.add("hidden"),
          );
        document
          .getElementById("manualTransactionForm")
          ?.addEventListener("submit", (e) => {
            e.preventDefault();
            const refCode = document
              .getElementById("transRefCode")
              .value.trim();
            const paymentMethod =
              document.getElementById("transPaymentMethod").value;
            const transCode = document.getElementById("transCode").value;
            const amount = parseFloat(
              document.getElementById("transAmount").value,
            );
            const status = document.getElementById("transStatus").value;
            const orderId = document.getElementById("transOrder").value;
            const notes = document.getElementById("transNotes").value;
            if (!refCode || isNaN(amount) || amount <= 0) {
              alert("Please provide valid Reference Code and Amount");
              return;
            }
            let customer = "";
            if (orderId) {
              const orderMap = {
                "ORD-12847": "Sarah Mwangi",
                "ORD-12846": "John Kamau",
                "ORD-12845": "Grace Njeri",
                "ORD-12844": "Peter Omondi",
                "ORD-12843": "Mary Wanjiku",
              };
              customer = orderMap[orderId] || "";
            }
            const newTransaction = {
              id: generateTransactionId(),
              refCode: refCode,
              paymentMethod: paymentMethod,
              transCode: transCode,
              amount: amount,
              status: status,
              orderId: orderId || "N/A",
              customer: customer || "Walk-in Customer",
              date: new Date().toISOString().slice(0, 10),
              notes: notes,
            };
            successTransactions.unshift(newTransaction);
            alert(
              `✅ Transaction ${newTransaction.refCode} added successfully! Amount: KES ${amount.toLocaleString()}`,
            );
            document
              .getElementById("manualTransactionModal")
              .classList.add("hidden");
            e.target.reset();
            renderCurrentTab();
          });
        // Expense Modal events
        document
          .getElementById("closeExpenseModal")
          ?.addEventListener("click", () =>
            document.getElementById("expenseModal").classList.add("hidden"),
          );
        document
          .getElementById("cancelExpenseBtn")
          ?.addEventListener("click", () =>
            document.getElementById("expenseModal").classList.add("hidden"),
          );
        document
          .getElementById("expenseForm")
          ?.addEventListener("submit", (e) => {
            e.preventDefault();
            const newExp = {
              id: `EXP-${String(expensesList.length + 101).padStart(3, "0")}`,
              category: document.getElementById("expenseCategory").value,
              amount: parseFloat(
                document.getElementById("expenseAmount").value,
              ),
              date:
                document.getElementById("expenseDate").value ||
                new Date().toISOString().slice(0, 10),
              method: document.getElementById("expenseMethod").value,
              description: document.getElementById("expenseDesc").value,
            };
            if (isNaN(newExp.amount)) return alert("Enter valid amount");
            expensesList.push(newExp);
            renderCurrentTab();
            document.getElementById("expenseModal").classList.add("hidden");
            e.target.reset();
          });
      }

      document.querySelectorAll(".nav-item").forEach((item) =>
        item.addEventListener("click", function () {
          document
            .querySelectorAll(".nav-item")
            .forEach((n) =>
              n.classList.remove("bg-emerald-50", "text-emerald-700"),
            );
          this.classList.add("bg-emerald-50", "text-emerald-700");
          activeTab = this.getAttribute("data-tab");
          renderCurrentTab();
        }),
      );
      document
        .getElementById("mobileMenuBtn")
        ?.addEventListener("click", () =>
          document.getElementById("sidebar").classList.toggle("open"),
        );
      renderCurrentTab();
    </script>
  </body>
</html>
