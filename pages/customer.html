<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Boy Alone | Customer Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 100%);
      }
      .fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .customer-card {
        transition: all 0.2s ease;
      }
      .customer-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
      }
      .modal-transition {
        transition: opacity 0.2s ease;
      }
      .action-btn {
        transition: all 0.15s ease;
      }
      .action-btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body class="antialiased p-4 md:p-6">
    <!-- MAIN CUSTOMER HUB  -->
    <div id="lipaCustomerHub" class="max-w-7xl mx-auto"></div>

    <!-- ==================== ADD / EDIT MODAL (reusable) ==================== -->
    <div
      id="customerFormModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto p-4 modal-transition"
    >
      <div
        class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl max-h-[90vh] overflow-y-auto custom-scroll"
      >
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-5 rounded-t-2xl flex justify-between items-center"
        >
          <h3 id="formModalTitle" class="text-2xl font-bold text-gray-800">
            <i class="fas fa-user-plus text-emerald-600 mr-2"></i>Add New
            Customer
          </h3>
          <button
            id="closeFormModalBtn"
            class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full hover:bg-gray-100"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="customerForm" class="space-y-5">
            <input type="hidden" id="editCustomerId" value="" />
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Full Name <span class="text-red-500">*</span></label
                ><input
                  type="text"
                  id="custName"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"
                  placeholder="John Doe"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Email Address</label
                ><input
                  type="email"
                  id="custEmail"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="customer@example.com"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Phone Number <span class="text-red-500">*</span></label
                ><input
                  type="tel"
                  id="custPhone"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="+254 XXX XXX XXX"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Customer Segment</label
                ><select
                  id="custSegment"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="New">New Customer</option>
                  <option value="Regular">Regular</option>
                  <option value="VIP">VIP</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Risk / Payment Score Level</label
                ><select
                  id="custRiskLevel"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="low">Low Risk (Good Payer)</option>
                  <option value="medium">Medium Risk</option>
                  <option value="high">High Risk (Needs Monitoring)</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Shipping Address</label
                ><input
                  type="text"
                  id="custAddress"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Street, City, Postal Code"
                />
              </div>
            </div>
            <div
              class="bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl"
            >
              <p class="text-sm text-emerald-800">
                <i class="fas fa-info-circle mr-2"></i>Customers start with 0
                orders when created. Edit mode preserves existing data.
              </p>
            </div>
            <div class="flex gap-3 justify-end pt-4 border-t">
              <button
                type="button"
                id="cancelFormBtn"
                class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 font-medium"
              >
                Cancel</button
              ><button
                type="submit"
                id="submitFormBtn"
                class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl hover:shadow-lg font-medium"
              >
                <i class="fas fa-save mr-2"></i>Save Customer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Customer Detail Modal (with edit/delete actions inside) -->
    <div
      id="customerDetailModal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto modal-transition"
    >
      <div
        class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl custom-scroll"
      >
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 rounded-t-2xl flex justify-between items-center"
        >
          <h3 class="text-xl font-bold text-gray-800">
            <i class="fas fa-user-circle text-emerald-600 mr-2"></i>Customer
            Details
          </h3>
          <button
            id="closeCustomerModalBtn"
            class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full hover:bg-gray-100"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div id="customerDetailContent" class="p-6 space-y-5"></div>
        <div
          class="border-t border-gray-100 px-6 py-4 flex gap-3 justify-between items-center bg-gray-50 rounded-b-2xl"
        >
          <div class="flex gap-2">
            <button
              id="editFromDetailBtn"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2"
            >
              <i class="fas fa-edit"></i> Edit Customer
            </button>
            <button
              id="deleteFromDetailBtn"
              class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center gap-2"
            >
              <i class="fas fa-trash-alt"></i> Delete
            </button>
          </div>
          <button
            id="closeCustomerModalFooterBtn"
            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Delete confirmation toast style modal -->
    <div
      id="deleteConfirmModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl text-center"
      >
        <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
        <h3 class="text-xl font-bold text-gray-800 mb-2">Confirm Deletion</h3>
        <p class="text-gray-600 mb-6">
          Are you sure you want to delete this customer? This action cannot be
          undone.
        </p>
        <div class="flex gap-3 justify-center">
          <button
            id="confirmDeleteBtn"
            class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
          >
            Yes, Delete</button
          ><button
            id="cancelDeleteBtn"
            class="px-5 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        // ---------- DATA ----------
        let customersData = [
          {
            id: "CUST-001",
            name: "Sarah Mwangi",
            email: "sarah.mwangi@email.com",
            phone: "+254 712 345 678",
            totalOrders: 24,
            totalSpent: 125400,
            activeInstallments: 2,
            paymentScore: 95,
            riskLevel: "low",
            segment: "VIP",
            joinedDate: "2025-06-15",
            lastPurchase: "2026-04-09",
            address: "123 Kimathi Street, Nairobi",
          },
          {
            id: "CUST-002",
            name: "John Kamau",
            email: "john.kamau@email.com",
            phone: "+254 723 456 789",
            totalOrders: 12,
            totalSpent: 67800,
            activeInstallments: 1,
            paymentScore: 72,
            riskLevel: "medium",
            segment: "Regular",
            joinedDate: "2025-08-22",
            lastPurchase: "2026-04-08",
            address: "45 Moi Avenue, Mombasa",
          },
          {
            id: "CUST-003",
            name: "Grace Njeri",
            email: "grace.njeri@email.com",
            phone: "+254 734 567 890",
            totalOrders: 8,
            totalSpent: 42500,
            activeInstallments: 3,
            paymentScore: 88,
            riskLevel: "low",
            segment: "Regular",
            joinedDate: "2025-10-11",
            lastPurchase: "2026-04-08",
            address: "78 Ngong Road, Nairobi",
          },
          {
            id: "CUST-004",
            name: "Peter Omondi",
            email: "peter.omondi@email.com",
            phone: "+254 745 678 901",
            totalOrders: 5,
            totalSpent: 28900,
            activeInstallments: 1,
            paymentScore: 55,
            riskLevel: "high",
            segment: "New",
            joinedDate: "2025-12-03",
            lastPurchase: "2026-04-07",
            address: "12 Kenyatta Avenue, Kisumu",
          },
          {
            id: "CUST-005",
            name: "Mary Wanjiku",
            email: "mary.wanjiku@email.com",
            phone: "+254 756 789 012",
            totalOrders: 18,
            totalSpent: 89300,
            activeInstallments: 2,
            paymentScore: 92,
            riskLevel: "low",
            segment: "VIP",
            joinedDate: "2025-05-20",
            lastPurchase: "2026-04-07",
            address: "99 Thika Road, Kiambu",
          },
        ];

        let selectedCustomerForDetail = null;
        let pendingDeleteId = null;

        const riskConfig = {
          low: { label: "Low Risk", color: "bg-green-100 text-green-700" },
          medium: {
            label: "Medium Risk",
            color: "bg-amber-100 text-amber-700",
          },
          high: { label: "High Risk", color: "bg-red-100 text-red-700" },
        };
        const segmentConfig = {
          VIP: { color: "bg-purple-100 text-purple-700", icon: "fa-star" },
          Regular: { color: "bg-blue-100 text-blue-700", icon: "fa-users" },
          New: { color: "bg-gray-100 text-gray-700", icon: "fa-user-plus" },
        };

        function escapeHtml(str) {
          return String(str ?? "").replace(/[&<>]/g, (m) =>
            m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
          );
        }

        function generateCustomerId() {
          const lastId = customersData.length
            ? Math.max(
                ...customersData.map((c) => parseInt(c.id.split("-")[1])),
              )
            : 0;
          return `CUST-${String(lastId + 1).padStart(3, "0")}`;
        }

        // Helper to compute paymentScore from risk level (for new & edit consistency)
        function getPaymentScoreFromRisk(riskLevel) {
          if (riskLevel === "low") return 85;
          if (riskLevel === "medium") return 65;
          return 45;
        }

        // Add or Update customer
        function saveCustomer(formData, editId = null) {
          if (editId) {
            // Update existing
            const index = customersData.findIndex((c) => c.id === editId);
            if (index !== -1) {
              const old = customersData[index];
              const updated = {
                ...old,
                name: formData.name,
                email: formData.email,
                phone: formData.phone,
                segment: formData.segment,
                riskLevel: formData.riskLevel,
                address: formData.address,
                paymentScore: getPaymentScoreFromRisk(formData.riskLevel),
              };
              customersData[index] = updated;
              return updated;
            }
            return null;
          } else {
            // Create new
            const newCustomer = {
              id: generateCustomerId(),
              name: formData.name,
              email: formData.email || "",
              phone: formData.phone,
              totalOrders: 0,
              totalSpent: 0,
              activeInstallments: 0,
              paymentScore: getPaymentScoreFromRisk(formData.riskLevel),
              riskLevel: formData.riskLevel,
              segment: formData.segment,
              joinedDate: new Date().toISOString().slice(0, 10),
              lastPurchase: new Date().toISOString().slice(0, 10),
              address: formData.address || "",
            };
            customersData.unshift(newCustomer);
            return newCustomer;
          }
        }

        function deleteCustomerById(customerId) {
          customersData = customersData.filter((c) => c.id !== customerId);
          if (
            selectedCustomerForDetail &&
            selectedCustomerForDetail.id === customerId
          ) {
            closeCustomerDetailModal();
            selectedCustomerForDetail = null;
          }
          refreshUI();
        }

        // Render main hub
        function renderCustomersHub() {
          const totalCustomers = customersData.length;
          const vipCount = customersData.filter(
            (c) => c.segment === "VIP",
          ).length;
          const activePlans = customersData.reduce(
            (sum, c) => sum + c.activeInstallments,
            0,
          );
          const avgSpend = customersData.length
            ? Math.round(
                customersData.reduce((sum, c) => sum + c.totalSpent, 0) /
                  customersData.length,
              )
            : 0;
          return `
          <div class="space-y-6 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div><h1 class="text-3xl font-bold text-gray-800">Customer Management</h1><p class="text-gray-500 mt-1">Manage, edit, delete customers & track payment scores</p></div>
              <button id="globalAddCustomerBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-5 py-2.5 rounded-xl hover:shadow-lg transition flex items-center gap-2 shadow-md"><i class="fas fa-user-plus"></i> Add Customer</button>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-blue-600 mb-2"><i class="fas fa-users"></i><p class="text-sm font-medium">Total Customers</p></div><p class="text-2xl font-semibold">${totalCustomers}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-purple-600 mb-2"><i class="fas fa-star"></i><p class="text-sm font-medium">VIP Customers</p></div><p class="text-2xl font-semibold">${vipCount}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-green-600 mb-2"><i class="fas fa-chart-line"></i><p class="text-sm font-medium">Active Plans</p></div><p class="text-2xl font-semibold">${activePlans}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-amber-600 mb-2"><i class="fas fa-credit-card"></i><p class="text-sm font-medium">Avg Spend</p></div><p class="text-2xl font-semibold">KES ${(avgSpend / 1000).toFixed(0)}K</p></div>
            </div>
            <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="relative"><i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="customerSearchInput" placeholder="Search customers by name, email, or phone..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500"></div></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5" id="customersGridContainer"></div>
          </div>
        `;
        }

        function renderCustomersGrid(filteredCustomers) {
          const container = document.getElementById("customersGridContainer");
          if (!container) return;
          if (filteredCustomers.length === 0) {
            container.innerHTML =
              '<div class="col-span-2 text-center py-12 text-gray-400 bg-white rounded-xl border"><i class="fas fa-users-slash text-4xl mb-3"></i><p>No customers found</p></div>';
            return;
          }
          container.innerHTML = filteredCustomers
            .map((customer) => {
              const segment = segmentConfig[customer.segment];
              const risk = riskConfig[customer.riskLevel];
              const initials = customer.name
                .split(" ")
                .map((n) => n[0])
                .join("")
                .slice(0, 2);
              return `
            <div class="customer-card bg-white border border-gray-200 rounded-xl p-6 hover:shadow-md transition-all" data-customer-id="${customer.id}">
              <div class="flex items-start justify-between mb-3">
                <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-semibold text-lg">${initials}</div><div><h3 class="font-semibold text-gray-800">${escapeHtml(customer.name)}</h3><p class="text-sm text-gray-500">${customer.id}</p></div></div>
                <div class="flex gap-2">
                  <button class="edit-card-btn text-blue-600 hover:bg-blue-50 p-2 rounded-full transition action-btn" data-id="${customer.id}" title="Edit"><i class="fas fa-edit"></i></button>
                  <button class="delete-card-btn text-red-600 hover:bg-red-50 p-2 rounded-full transition action-btn" data-id="${customer.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                </div>
              </div>
              <div class="space-y-2 mb-4 pb-4 border-b border-gray-100"><div class="flex items-center gap-2 text-sm text-gray-500"><i class="fas fa-envelope w-4"></i> ${escapeHtml(customer.email || "—")}</div><div class="flex items-center gap-2 text-sm text-gray-500"><i class="fas fa-phone w-4"></i> ${escapeHtml(customer.phone)}</div></div>
              <div class="grid grid-cols-2 gap-4 mb-4"><div><p class="text-xs text-gray-500 mb-1">Total Orders</p><p class="text-lg font-semibold">${customer.totalOrders}</p></div><div><p class="text-xs text-gray-500 mb-1">Total Spent</p><p class="text-lg font-semibold">KES ${(customer.totalSpent / 1000).toFixed(0)}K</p></div><div><p class="text-xs text-gray-500 mb-1">Active Plans</p><p class="text-lg font-semibold">${customer.activeInstallments}</p></div><div><p class="text-xs text-gray-500 mb-1">Payment Score</p><div class="flex items-center gap-2"><p class="text-lg font-semibold">${customer.paymentScore}</p><span class="px-2 py-0.5 rounded text-xs font-medium ${risk.color}">${risk.label}</span></div></div></div>
              <div class="flex items-center justify-between text-xs text-gray-400 pt-4 border-t border-gray-100"><span>Joined: ${new Date(customer.joinedDate).toLocaleDateString()}</span><span>Last: ${new Date(customer.lastPurchase).toLocaleDateString()}</span></div>
            </div>
          `;
            })
            .join("");

          // Attach card click (view detail)
          document.querySelectorAll(".customer-card").forEach((card) => {
            card.addEventListener("click", (e) => {
              if (
                e.target.closest(".edit-card-btn") ||
                e.target.closest(".delete-card-btn")
              )
                return;
              const id = card.getAttribute("data-customer-id");
              const customer = customersData.find((c) => c.id === id);
              if (customer) openCustomerDetailModal(customer);
            });
          });
          // Edit buttons on cards
          document.querySelectorAll(".edit-card-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const id = btn.getAttribute("data-id");
              const customer = customersData.find((c) => c.id === id);
              if (customer) openEditModal(customer);
            });
          });
          // Delete buttons on cards
          document.querySelectorAll(".delete-card-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const id = btn.getAttribute("data-id");
              pendingDeleteId = id;
              document
                .getElementById("deleteConfirmModal")
                .classList.remove("hidden");
              document
                .getElementById("deleteConfirmModal")
                .classList.add("flex");
            });
          });
        }

        function filterCustomers() {
          const searchTerm =
            document
              .getElementById("customerSearchInput")
              ?.value.toLowerCase() || "";
          const filtered = customersData.filter(
            (c) =>
              c.name.toLowerCase().includes(searchTerm) ||
              c.email.toLowerCase().includes(searchTerm) ||
              c.phone.includes(searchTerm),
          );
          renderCustomersGrid(filtered);
        }

        // ---------- MODAL LOGIC (Edit / Add) ----------
        function openAddModal() {
          document.getElementById("formModalTitle").innerHTML =
            '<i class="fas fa-user-plus text-emerald-600 mr-2"></i>Add New Customer';
          document.getElementById("editCustomerId").value = "";
          document.getElementById("customerForm").reset();
          document.getElementById("custRiskLevel").value = "low";
          document.getElementById("custSegment").value = "New";
          document
            .getElementById("customerFormModal")
            .classList.remove("hidden");
          document.getElementById("customerFormModal").classList.add("flex");
        }

        function openEditModal(customer) {
          document.getElementById("formModalTitle").innerHTML =
            '<i class="fas fa-edit text-blue-600 mr-2"></i>Edit Customer';
          document.getElementById("editCustomerId").value = customer.id;
          document.getElementById("custName").value = customer.name;
          document.getElementById("custEmail").value = customer.email || "";
          document.getElementById("custPhone").value = customer.phone;
          document.getElementById("custSegment").value = customer.segment;
          document.getElementById("custRiskLevel").value = customer.riskLevel;
          document.getElementById("custAddress").value = customer.address || "";
          document
            .getElementById("customerFormModal")
            .classList.remove("hidden");
          document.getElementById("customerFormModal").classList.add("flex");
        }

        function closeFormModal() {
          document.getElementById("customerFormModal").classList.add("hidden");
          document.getElementById("customerFormModal").classList.remove("flex");
        }

        // Customer Detail Modal (with Edit & Delete inside)
        function openCustomerDetailModal(customer) {
          selectedCustomerForDetail = customer;
          const risk = riskConfig[customer.riskLevel];
          const segment = segmentConfig[customer.segment];
          const container = document.getElementById("customerDetailContent");
          container.innerHTML = `
          <div class="flex items-center gap-4 pb-4 border-b"><div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-2xl font-bold">${customer.name
            .split(" ")
            .map((n) => n[0])
            .join(
              "",
            )}</div><div><h2 class="text-xl font-bold">${escapeHtml(customer.name)}</h2><p class="text-gray-500">${customer.id}</p><span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${segment.color} mt-1"><i class="fas ${segment.icon} text-xs"></i> ${customer.segment}</span></div></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-gray-50 rounded-xl p-4"><p class="text-sm text-gray-500 mb-1"><i class="fas fa-envelope mr-2"></i>Email</p><p class="font-medium">${escapeHtml(customer.email) || "—"}</p></div><div class="bg-gray-50 rounded-xl p-4"><p class="text-sm text-gray-500 mb-1"><i class="fas fa-phone mr-2"></i>Phone</p><p class="font-medium">${escapeHtml(customer.phone)}</p></div><div class="bg-gray-50 rounded-xl p-4 md:col-span-2"><p class="text-sm text-gray-500 mb-1"><i class="fas fa-map-marker-alt mr-2"></i>Address</p><p class="font-medium">${escapeHtml(customer.address) || "Not provided"}</p></div></div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="bg-emerald-50 rounded-xl p-3 text-center"><p class="text-xs text-gray-600 mb-1">Total Orders</p><p class="text-2xl font-bold text-emerald-700">${customer.totalOrders}</p></div><div class="bg-blue-50 rounded-xl p-3 text-center"><p class="text-xs text-gray-600 mb-1">Total Spent</p><p class="text-2xl font-bold text-blue-700">KES ${customer.totalSpent.toLocaleString()}</p></div><div class="bg-purple-50 rounded-xl p-3 text-center"><p class="text-xs text-gray-600 mb-1">Active Plans</p><p class="text-2xl font-bold text-purple-700">${customer.activeInstallments}</p></div><div class="bg-amber-50 rounded-xl p-3 text-center"><p class="text-xs text-gray-600 mb-1">Payment Score</p><p class="text-2xl font-bold text-amber-700">${customer.paymentScore}<span class="text-sm">/100</span></p></div></div>
          <div class="bg-gray-50 rounded-xl p-4"><div class="flex justify-between items-center flex-wrap gap-2"><div><p class="text-sm text-gray-500">Risk Assessment</p><p class="text-lg font-semibold ${risk.color.split(" ")[0]}">${risk.label}</p></div><div><p class="text-sm text-gray-500">Member Since</p><p class="font-medium">${new Date(customer.joinedDate).toLocaleDateString()}</p></div><div><p class="text-sm text-gray-500">Last Purchase</p><p class="font-medium">${new Date(customer.lastPurchase).toLocaleDateString()}</p></div></div></div>
          <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl p-4"><div class="flex justify-between items-center"><span class="font-semibold"><i class="fas fa-chart-line mr-2"></i>Loyalty Status</span><span class="text-emerald-700 font-bold">${customer.totalSpent > 100000 ? "Platinum" : customer.totalSpent > 50000 ? "Gold" : "Silver"}</span></div><div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-emerald-600 h-2 rounded-full" style="width: ${Math.min(100, (customer.totalSpent / 150000) * 100)}%"></div></div></div>
        `;
          document
            .getElementById("customerDetailModal")
            .classList.remove("hidden");
          document.getElementById("customerDetailModal").classList.add("flex");
        }

        function closeCustomerDetailModal() {
          document
            .getElementById("customerDetailModal")
            .classList.add("hidden");
          document
            .getElementById("customerDetailModal")
            .classList.remove("flex");
          selectedCustomerForDetail = null;
        }

        function refreshUI() {
          const container = document.getElementById("lipaCustomerHub");
          if (container) {
            container.innerHTML = renderCustomersHub();
            renderCustomersGrid(customersData);
            attachGlobalEvents();
          }
        }

        function attachGlobalEvents() {
          const searchInput = document.getElementById("customerSearchInput");
          if (searchInput)
            searchInput.addEventListener("input", filterCustomers);
          const addBtn = document.getElementById("globalAddCustomerBtn");
          if (addBtn) addBtn.addEventListener("click", openAddModal);
        }

        // Form submit handler
        function initFormHandler() {
          const form = document.getElementById("customerForm");
          if (form) {
            form.addEventListener("submit", (e) => {
              e.preventDefault();
              const name = document.getElementById("custName").value.trim();
              const phone = document.getElementById("custPhone").value.trim();
              if (!name || !phone) {
                alert("Name and Phone are required.");
                return;
              }
              const email = document.getElementById("custEmail").value.trim();
              const segment = document.getElementById("custSegment").value;
              const riskLevel = document.getElementById("custRiskLevel").value;
              const address = document.getElementById("custAddress").value;
              const editId = document.getElementById("editCustomerId").value;
              const saved = saveCustomer(
                { name, email, phone, segment, riskLevel, address },
                editId || null,
              );
              if (saved) {
                alert(
                  editId
                    ? `✅ Customer "${saved.name}" updated successfully!`
                    : `✅ New customer "${saved.name}" added!`,
                );
                closeFormModal();
                refreshUI();
              } else {
                alert("Error saving customer");
              }
            });
          }
        }

        function initDeleteModal() {
          const confirmBtn = document.getElementById("confirmDeleteBtn");
          const cancelBtn = document.getElementById("cancelDeleteBtn");
          const modal = document.getElementById("deleteConfirmModal");
          if (confirmBtn)
            confirmBtn.addEventListener("click", () => {
              if (pendingDeleteId) {
                deleteCustomerById(pendingDeleteId);
                pendingDeleteId = null;
              }
              modal.classList.add("hidden");
              modal.classList.remove("flex");
            });
          if (cancelBtn)
            cancelBtn.addEventListener("click", () => {
              modal.classList.add("hidden");
              modal.classList.remove("flex");
              pendingDeleteId = null;
            });
          window.addEventListener("click", (e) => {
            if (e.target === modal) {
              modal.classList.add("hidden");
              modal.classList.remove("flex");
              pendingDeleteId = null;
            }
          });
        }

        function initDetailModalActions() {
          const editDetailBtn = document.getElementById("editFromDetailBtn");
          const deleteDetailBtn = document.getElementById(
            "deleteFromDetailBtn",
          );
          if (editDetailBtn)
            editDetailBtn.addEventListener("click", () => {
              if (selectedCustomerForDetail) {
                closeCustomerDetailModal();
                openEditModal(selectedCustomerForDetail);
              }
            });
          if (deleteDetailBtn)
            deleteDetailBtn.addEventListener("click", () => {
              if (selectedCustomerForDetail) {
                pendingDeleteId = selectedCustomerForDetail.id;
                closeCustomerDetailModal();
                document
                  .getElementById("deleteConfirmModal")
                  .classList.remove("hidden");
                document
                  .getElementById("deleteConfirmModal")
                  .classList.add("flex");
              }
            });
          const closeBtns = [
            "closeCustomerModalBtn",
            "closeCustomerModalFooterBtn",
          ];
          closeBtns.forEach((id) => {
            const btn = document.getElementById(id);
            if (btn) btn.addEventListener("click", closeCustomerDetailModal);
          });
        }

        function init() {
          refreshUI();
          initFormHandler();
          initDeleteModal();
          initDetailModalActions();
          const closeModalBtn = document.getElementById("closeFormModalBtn");
          const cancelFormBtn = document.getElementById("cancelFormBtn");
          if (closeModalBtn)
            closeModalBtn.addEventListener("click", closeFormModal);
          if (cancelFormBtn)
            cancelFormBtn.addEventListener("click", closeFormModal);
          window.addEventListener("click", (e) => {
            if (e.target === document.getElementById("customerFormModal"))
              closeFormModal();
            if (e.target === document.getElementById("customerDetailModal"))
              closeCustomerDetailModal();
          });
        }

        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init);
        else init();
      })();
    </script>
  </body>
</html>
