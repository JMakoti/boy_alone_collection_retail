<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Boy Alone | Lipa Mdogo Mdogo Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 100%);
      }
      .scrollbar-custom::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-custom::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .scrollbar-custom::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hover-scale {
        transition: all 0.2s ease;
      }
      .hover-scale:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.15);
      }
      .tab-active {
        border-bottom: 2px solid #059669;
        color: #059669;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="antialiased p-4 md:p-6">
    <!-- MAIN LIPA MDOGO CORE MODULE WRAPPER (fully independent, ready for Laravel blade include) -->
    <div id="lipaMdogoCoreRoot" class="max-w-7xl mx-auto"></div>

    <!-- Record Payment Modal -->
    <div
      id="recordPaymentModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8"
    >
      <div class="bg-white rounded-2xl max-w-md w-full mx-4 shadow-2xl">
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-5 rounded-t-2xl flex justify-between items-center"
        >
          <h3 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-hand-holding-usd text-emerald-600 mr-2"></i>Record
            Payment
          </h3>
          <button
            id="closeRecordPaymentModal"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="recordPaymentForm" class="space-y-5">
            <div
              id="paymentPlanInfo"
              class="bg-emerald-50 p-4 rounded-xl text-sm"
            ></div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Payment Amount (KES) <span class="text-red-500">*</span></label
              >
              <input
                type="number"
                id="paymentAmount"
                required
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"
                placeholder="Enter amount"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Payment Method</label
              >
              <select
                id="paymentMethod"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
              >
                <option>M-Pesa</option>
                <option>Airtel Money</option>
                <option>Bank Transfer</option>
                <option>Cash</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Reference / Transaction ID (Optional)</label
              >
              <input
                type="text"
                id="paymentRef"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                placeholder="e.g., M-Pesa confirmation code"
              />
            </div>
            <div class="flex gap-3 justify-end pt-4">
              <button
                type="button"
                id="cancelRecordPaymentBtn"
                class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 font-medium"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl hover:shadow-lg font-medium"
              >
                <i class="fas fa-save mr-2"></i>Record Payment
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Remind Customer Modal -->
    <div
      id="remindModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8"
    >
      <div class="bg-white rounded-2xl max-w-md w-full mx-4 shadow-2xl">
        <div class="px-6 py-5 border-b flex justify-between items-center">
          <h3 class="text-2xl font-bold">
            <i class="fas fa-paper-plane text-emerald-600 mr-2"></i>Send
            Reminder
          </h3>
          <button
            id="closeRemindModal"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <div id="remindPlanInfo" class="mb-4 text-sm text-gray-600"></div>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-semibold mb-1"
                >SMS / WhatsApp Message</label
              >
              <textarea
                id="reminderMessage"
                rows="4"
                class="w-full px-4 py-2.5 border rounded-xl"
                placeholder="Custom reminder message..."
              ></textarea>
            </div>
            <div class="flex gap-3 justify-end">
              <button id="cancelRemindBtn" class="px-4 py-2 border rounded-lg">
                Cancel
              </button>
              <button
                id="sendReminderBtn"
                class="px-4 py-2 bg-emerald-600 text-white rounded-lg"

                <i class="fas fa-paper-plane mr-2"></i>Send Reminder
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Payment Plan Modal -->
    <div
      id="createPlanModal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8"
    >
      <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 shadow-2xl">
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-5 rounded-t-2xl flex justify-between items-center"
        >
          <h3 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-file-invoice text-emerald-600 mr-2"></i>Create
            Payment Plan
          </h3>
          <button
            id="closeCreatePlanModal"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="createPlanForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Customer Name <span class="text-red-500">*</span></label
                >
                <input
                  type="text"
                  id="planCustomerName"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Full name"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Order ID <span class="text-red-500">*</span></label
                >
                <input
                  type="text"
                  id="planOrderId"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="ORD-XXXXX"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Total Amount (KES) <span class="text-red-500">*</span></label
                >
                <input
                  type="number"
                  id="planTotalAmount"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="e.g., 15000"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Number of Installments
                  <span class="text-red-500">*</span></label
                >
                <select
                  id="planInstallments"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="3">3 months</option>
                  <option value="6">6 months</option>
                  <option value="9">9 months</option>
                  <option value="12">12 months</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Payment Method</label
                >
                <select
                  id="planPaymentMethod"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option>M-Pesa</option>
                  <option>Airtel Money</option>
                  <option>Bank Transfer</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Start Date</label
                >
                <input
                  type="date"
                  id="planStartDate"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                />
              </div>
            </div>
            <div
              class="bg-gradient-to-r from-emerald-50 to-teal-50 p-4 rounded-xl"
            >
              <p class="text-sm text-emerald-800">
                <i class="fas fa-info-circle mr-2"></i>Monthly installment
                amount will be calculated automatically.
              </p>
            </div>
            <div class="flex gap-3 justify-end pt-4 border-t">
              <button
                type="button"
                id="cancelCreatePlanBtn"
                class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 font-medium"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl hover:shadow-lg font-medium"
              >
                <i class="fas fa-save mr-2"></i>Create Plan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // ==================== LIPA MDOGO CORE MODULE - STANDALONE ====================
      // Payment plans only - no expenses, no transactions outside core functionality

      (function () {
        // Payment Plans Data
        let paymentPlansData = [
          {
            id: "PAY-001",

            totalAmount: 12450,

            phone: "+254 712 345 678",
          },
          {

            totalAmount: 8900,

            remainingAmount: 5933,
            installments: 9,
            installmentAmount: 989,
            frequency: "monthly",
            nextPaymentDate: "2026-04-07",

            paymentMethod: "M-Pesa",

            phone: "+254 723 456 789",
          },
          {
            id: "PAY-003",
            customer: "Grace Njeri",
            orderId: "ORD-12845",
            totalAmount: 18900,
            paidAmount: 3150,
            remainingAmount: 15750,
            installments: 12,
            installmentAmount: 1575,
            frequency: "monthly",
            nextPaymentDate: "2026-05-08",
            status: "active",
            paymentMethod: "Airtel Money",
            startDate: "2026-03-08",
            phone: "+254 734 567 890",
          },
          {
            id: "PAY-004",
            customer: "Mary Wanjiku",
            orderId: "ORD-12843",
            totalAmount: 15200,
            paidAmount: 5067,
            remainingAmount: 10133,
            installments: 9,
            installmentAmount: 1689,
            frequency: "monthly",
            nextPaymentDate: "2026-05-07",
            status: "active",
            paymentMethod: "M-Pesa",
            startDate: "2026-01-07",
            phone: "+254 756 789 012",
          },
          {
            id: "PAY-005",
            customer: "Peter Omondi",
            orderId: "ORD-12789",
            totalAmount: 6500,
            paidAmount: 1083,
            remainingAmount: 5417,
            installments: 6,
            installmentAmount: 1083,
            frequency: "monthly",
            nextPaymentDate: "2026-03-20",
            status: "overdue",
            daysOverdue: 22,
            paymentMethod: "M-Pesa",
            startDate: "2025-11-20",
            phone: "+254 745 678 901",
          },
          {
            id: "PAY-006",
            customer: "James Otieno",
            orderId: "ORD-12890",
            totalAmount: 22500,
            paidAmount: 0,
            remainingAmount: 22500,
            installments: 12,
            installmentAmount: 1875,
            frequency: "monthly",
            nextPaymentDate: "2026-05-15",
            status: "active",
            paymentMethod: "Bank Transfer",
            startDate: "2026-04-15",
            phone: "+254 712 345 000",
          },
        ];

        let selectedPlanForAction = null;
        let chartInstance = null;

        // Collection data for dashboard
        const collectionData = [
          { month: "Oct", collected: 380000, expected: 420000 },
          { month: "Nov", collected: 425000, expected: 450000 },
          { month: "Dec", collected: 510000, expected: 520000 },
          { month: "Jan", collected: 495000, expected: 500000 },
          { month: "Feb", collected: 540000, expected: 550000 },
          { month: "Mar", collected: 620000, expected: 630000 },
          { month: "Apr", collected: 580000, expected: 600000 },
        ];

        function formatCurrency(amount) {
          return new Intl.NumberFormat("en-KE", {
            style: "currency",
            currency: "KES",
            minimumFractionDigits: 0,
          }).format(amount);
        }

        function formatCompactCurrency(amount) {
          if (amount >= 1000000) return `KES ${(amount / 1000000).toFixed(1)}M`;
          if (amount >= 1000) return `KES ${(amount / 1000).toFixed(0)}K`;
          return `KES ${amount}`;
        }

        function recalcPlanStatus(plan) {
          if (plan.remainingAmount <= 0) {
            plan.status = "completed";
            plan.paidAmount = plan.totalAmount;
            plan.remainingAmount = 0;
          } else if (plan.daysOverdue > 0) {
            plan.status = "overdue";
          } else {
            plan.status = "active";
          }
          return plan;
        }

        function generatePlanId() {
          const lastId =
            paymentPlansData.length > 0
              ? Math.max(
                  ...paymentPlansData.map((p) => parseInt(p.id.split("-")[1])),
                )
              : 0;
          return `PAY-${String(lastId + 1).padStart(3, "0")}`;
        }

        function createNewPlan(formData) {
          const totalAmount = parseFloat(formData.totalAmount);
          const installments = parseInt(formData.installments);
          const installmentAmount = Math.round(totalAmount / installments);
          const startDate =
            formData.startDate || new Date().toISOString().slice(0, 10);
          const nextPaymentDate = new Date(startDate);
          nextPaymentDate.setMonth(nextPaymentDate.getMonth() + 1);

          const newPlan = {
            id: generatePlanId(),
            customer: formData.customerName,
            orderId: formData.orderId,
            totalAmount: totalAmount,
            paidAmount: 0,
            remainingAmount: totalAmount,
            installments: installments,
            installmentAmount: installmentAmount,
            frequency: "monthly",
            nextPaymentDate: nextPaymentDate.toISOString().slice(0, 10),
            status: "active",
            paymentMethod: formData.paymentMethod,
            startDate: startDate,
            daysOverdue: 0,
            phone: formData.phone || "",
          };
          paymentPlansData.unshift(newPlan);
          return newPlan;
        }

        function recordPayment(planId, amount, method, reference) {
          const plan = paymentPlansData.find((p) => p.id === planId);
          if (!plan) return false;
          if (amount > plan.remainingAmount) {
            alert(
              `Payment amount (${formatCurrency(amount)}) exceeds remaining balance of ${formatCurrency(plan.remainingAmount)}`,
            );
            return false;
          }
          plan.paidAmount += amount;
          plan.remainingAmount -= amount;

          // Update next payment date if remaining > 0
          if (plan.remainingAmount > 0) {
            const nextDate = new Date(plan.nextPaymentDate);
            nextDate.setMonth(nextDate.getMonth() + 1);
            plan.nextPaymentDate = nextDate.toISOString().slice(0, 10);
            plan.daysOverdue = 0;
          }
          recalcPlanStatus(plan);
          return true;
        }

        // Render main UI
        function renderMainUI() {
          const totalActive = paymentPlansData.filter(
            (p) => p.status === "active",
          ).length;
          const totalOverdue = paymentPlansData.filter(
            (p) => p.status === "overdue",
          ).length;
          const totalCompleted = paymentPlansData.filter(
            (p) => p.status === "completed",
          ).length;
          const totalOutstanding = paymentPlansData.reduce(
            (sum, p) => sum + p.remainingAmount,
            0,
          );
          const totalExpectedMonthly = paymentPlansData.reduce(
            (sum, p) => sum + p.installmentAmount,
            0,
          );

          return `
          <div class="space-y-6 fade-in">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 class="text-3xl font-bold text-gray-800"><i class="fas fa-hand-holding-usd text-emerald-600 mr-2"></i>Lipa Mdogo Core</h1>
                <p class="text-gray-500 mt-1">Payment plans management • Installment tracking • Collections</p>
              </div>
              <div class="flex gap-2">
                <button id="createPlanBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-5 py-2.5 rounded-xl hover:shadow-lg flex items-center gap-2"><i class="fas fa-plus-circle"></i> Create Payment Plan</button>
              </div>
            </div>

            <!-- KPI Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-green-600 mb-2"><i class="fas fa-check-circle"></i><p class="text-sm font-medium">Active Plans</p></div><p class="text-2xl font-semibold">${totalActive}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-red-600 mb-2"><i class="fas fa-exclamation-triangle"></i><p class="text-sm font-medium">Overdue</p></div><p class="text-2xl font-semibold">${totalOverdue}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-blue-600 mb-2"><i class="fas fa-dollar-sign"></i><p class="text-sm font-medium">Monthly Expected</p></div><p class="text-2xl font-semibold">${formatCompactCurrency(totalExpectedMonthly)}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-purple-600 mb-2"><i class="fas fa-credit-card"></i><p class="text-sm font-medium">Outstanding</p></div><p class="text-2xl font-semibold">${formatCompactCurrency(totalOutstanding)}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-emerald-600 mb-2"><i class="fas fa-check-double"></i><p class="text-sm font-medium">Completed</p></div><p class="text-2xl font-semibold">${totalCompleted}</p></div>
            </div>

            <!-- Tabs -->
            <div class="border-b border-gray-200 flex gap-6">
              <button class="tab-btn pb-3 px-1 text-emerald-600 border-b-2 border-emerald-600 font-medium" data-tab="plans">📋 Active Payment Plans</button>
              <button class="tab-btn pb-3 px-1 text-gray-500 hover:text-gray-700" data-tab="collections">📊 Collections Dashboard</button>
            </div>
            <div id="tabContentContainer"></div>
          </div>
        `;
        }

        function renderPlansTab() {
          const activePlans = paymentPlansData.filter(
            (p) => p.status !== "completed",
          );
          const statusConfig = {
            active: {
              label: "Active",
              color: "bg-green-100 text-green-700",
              icon: "fa-check-circle",
            },
            overdue: {
              label: "Overdue",
              color: "bg-red-100 text-red-700",
              icon: "fa-exclamation-triangle",
            },
          };

          return `<div class="space-y-4">${activePlans
            .map((plan) => {
              const config = statusConfig[plan.status] || statusConfig.active;
              const progress = (plan.paidAmount / plan.totalAmount) * 100;
              return `
            <div class="bg-white border rounded-xl p-6 hover:shadow-md transition" data-plan-id="${plan.id}">
              <div class="flex flex-col lg:flex-row gap-6">
                <div class="flex-1">
                  <div class="flex justify-between mb-4 flex-wrap gap-2">
                    <div><h3 class="font-semibold text-lg">${escapeHtml(plan.customer)}</h3><p class="text-sm text-gray-500">${plan.id} • Order: ${plan.orderId}</p></div>
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium ${config.color}"><i class="fas ${config.icon} text-xs"></i> ${config.label}${plan.daysOverdue ? ` (${plan.daysOverdue} days)` : ""}</span>
                  </div>
                  <div class="mb-4"><div class="flex justify-between text-sm mb-2"><span>Payment Progress</span><span>${progress.toFixed(0)}%</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500" style="width: ${progress}%"></div></div></div>
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div><p class="text-xs text-gray-500">Total</p><p class="font-semibold">${formatCurrency(plan.totalAmount)}</p></div>
                    <div><p class="text-xs text-gray-500">Paid</p><p class="font-semibold text-green-600">${formatCurrency(plan.paidAmount)}</p></div>
                    <div><p class="text-xs text-gray-500">Remaining</p><p class="font-semibold text-red-600">${formatCurrency(plan.remainingAmount)}</p></div>
                    <div><p class="text-xs text-gray-500">Installment</p><p class="font-semibold">${formatCurrency(plan.installmentAmount)}</p></div>
                  </div>
                </div>
                <div class="lg:w-64 space-y-3">
                  <div class="bg-gray-50 rounded-lg p-4"><div class="flex items-center gap-2 text-gray-500 mb-2"><i class="fas fa-calendar"></i><span class="text-xs">Next Payment</span></div><p class="text-lg font-semibold">${new Date(plan.nextPaymentDate).toLocaleDateString()}</p><p class="text-xs text-gray-500">${plan.frequency} • ${plan.installments} installments</p></div>
                  <div class="flex items-center gap-2 text-sm text-gray-500"><i class="fas fa-mobile-alt"></i> ${plan.paymentMethod}</div>
                  <div class="flex gap-2"><button class="remindPlanBtn flex-1 px-3 py-2 text-sm bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition" data-id="${plan.id}"><i class="fas fa-paper-plane mr-1"></i> Remind</button><button class="recordPaymentBtn flex-1 px-3 py-2 text-sm bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition" data-id="${plan.id}"><i class="fas fa-money-bill-wave mr-1"></i> Record</button></div>
                </div>
              </div>
            </div>
          `;
            })
            .join(
              "",
            )}${activePlans.length === 0 ? '<div class="bg-white rounded-xl p-12 text-center text-gray-500"><i class="fas fa-check-circle text-5xl mb-3 text-green-300"></i><p>No active payment plans. Create a new plan to get started.</p></div>' : ""}</div>`;
        }

        function renderCollectionsTab() {
          const canvasId = "collectionChart";
          setTimeout(() => {
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById(canvasId)?.getContext("2d");
            if (ctx) {
              chartInstance = new Chart(ctx, {
                type: "line",
                data: {
                  labels: collectionData.map((d) => d.month),
                  datasets: [
                    {
                      label: "Expected Collection",
                      data: collectionData.map((d) => d.expected),
                      borderColor: "#94a3b8",
                      backgroundColor: "rgba(148,163,184,0.1)",
                      fill: true,
                      tension: 0.4,
                      borderWidth: 2,
                    },
                    {
                      label: "Actual Collected",
                      data: collectionData.map((d) => d.collected),
                      borderColor: "#22c55e",
                      backgroundColor: "rgba(34,197,94,0.1)",
                      fill: true,
                      tension: 0.4,
                      borderWidth: 2,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    tooltip: {
                      callbacks: {
                        label: (ctx) => `KES ${ctx.raw.toLocaleString()}`,
                      },
                    },
                  },
                },
              });
            }
          }, 100);

          const totalCollected = collectionData.reduce(
            (s, d) => s + d.collected,
            0,
          );
          const totalExpected = collectionData.reduce(
            (s, d) => s + d.expected,
            0,
          );
          const overallRate = ((totalCollected / totalExpected) * 100).toFixed(
            1,
          );
          const thisMonthRate = (
            (collectionData[collectionData.length - 1].collected /
              collectionData[collectionData.length - 1].expected) *
            100
          ).toFixed(1);

          return `<div class="space-y-6"><div class="bg-white border rounded-xl p-6"><h3 class="font-semibold mb-4 text-gray-800"><i class="fas fa-chart-line text-emerald-600 mr-2"></i>Collection Performance Trend</h3><div style="height: 320px;"><canvas id="${canvasId}"></canvas></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="bg-white border rounded-xl p-6 text-center"><i class="fas fa-chart-pie text-3xl text-green-500 mb-2"></i><h3 class="font-semibold mb-2">Overall Collection Rate</h3><p class="text-4xl font-bold text-green-600">${overallRate}%</p><p class="text-sm text-gray-500 mt-1">Last 7 months</p></div><div class="bg-white border rounded-xl p-6 text-center"><i class="fas fa-calendar-week text-3xl text-blue-500 mb-2"></i><h3 class="font-semibold mb-2">This Month Rate</h3><p class="text-4xl font-bold text-blue-600">${thisMonthRate}%</p><p class="text-sm text-gray-500">${collectionData[collectionData.length - 1].month} collection</p></div><div class="bg-white border rounded-xl p-6 text-center"><i class="fas fa-hand-holding-usd text-3xl text-purple-500 mb-2"></i><h3 class="font-semibold mb-2">Avg Plan Value</h3><p class="text-4xl font-bold text-purple-600">${formatCompactCurrency(paymentPlansData.reduce((s, p) => s + p.totalAmount, 0) / paymentPlansData.length)}</p><p class="text-sm text-gray-500">Per customer</p></div></div></div>`;
        }

        function switchTab(tabId) {
          const container = document.getElementById("tabContentContainer");
          if (tabId === "plans") container.innerHTML = renderPlansTab();
          else if (tabId === "collections")
            container.innerHTML = renderCollectionsTab();
          attachTabSpecificEvents(tabId);
        }

        function attachTabSpecificEvents(tabId) {
          if (tabId === "plans") {
            document.querySelectorAll(".remindPlanBtn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                const id = btn.dataset.id;
                selectedPlanForAction = paymentPlansData.find(
                  (p) => p.id === id,
                );
                if (selectedPlanForAction) openRemindModal();
              });
            });
            document.querySelectorAll(".recordPaymentBtn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                const id = btn.dataset.id;
                selectedPlanForAction = paymentPlansData.find(
                  (p) => p.id === id,
                );
                if (selectedPlanForAction) openRecordPaymentModal();
              });
            });
          }
        }

        function openRecordPaymentModal() {
          if (!selectedPlanForAction) return;
          document.getElementById("paymentPlanInfo").innerHTML = `
          <div><strong>${escapeHtml(selectedPlanForAction.customer)}</strong><br>Plan: ${selectedPlanForAction.id}<br>Remaining: ${formatCurrency(selectedPlanForAction.remainingAmount)}<br>Next payment due: ${new Date(selectedPlanForAction.nextPaymentDate).toLocaleDateString()}</div>
        `;
          document
            .getElementById("recordPaymentModal")
            .classList.remove("hidden");
          document.getElementById("recordPaymentModal").classList.add("flex");
          document.getElementById("paymentAmount").value =
            selectedPlanForAction.installmentAmount;
          document.getElementById("paymentMethod").value =
            selectedPlanForAction.paymentMethod;
        }

        function closeRecordPaymentModal() {
          document.getElementById("recordPaymentModal").classList.add("hidden");
          document.getElementById("recordPaymentForm").reset();
        }

        function openRemindModal() {
          if (!selectedPlanForAction) return;
          document.getElementById("remindPlanInfo").innerHTML =
            `Sending reminder to: <strong>${escapeHtml(selectedPlanForAction.customer)}</strong> (${selectedPlanForAction.phone || "phone number not set"})<br>Outstanding: ${formatCurrency(selectedPlanForAction.remainingAmount)}<br>Next payment: ${new Date(selectedPlanForAction.nextPaymentDate).toLocaleDateString()}`;
          document.getElementById("reminderMessage").value =
            `Dear ${selectedPlanForAction.customer}, your installment payment of ${formatCurrency(selectedPlanForAction.installmentAmount)} is due on ${new Date(selectedPlanForAction.nextPaymentDate).toLocaleDateString()}. Current outstanding: ${formatCurrency(selectedPlanForAction.remainingAmount)}. Thank you for choosing Lipa Mdogo!`;
          document.getElementById("remindModal").classList.remove("hidden");
          document.getElementById("remindModal").classList.add("flex");
        }

        function closeRemindModal() {
          document.getElementById("remindModal").classList.add("hidden");
        }

        function openCreatePlanModal() {
          document.getElementById("createPlanModal").classList.remove("hidden");
          document.getElementById("createPlanModal").classList.add("flex");
          document.getElementById("planStartDate").value = new Date()
            .toISOString()
            .slice(0, 10);
        }

        function closeCreatePlanModal() {
          document.getElementById("createPlanModal").classList.add("hidden");
          document.getElementById("createPlanForm").reset();
        }

        function refreshUI() {
          const container = document.getElementById("lipaMdogoCoreRoot");
          container.innerHTML = renderMainUI();

          document
            .getElementById("createPlanBtn")
            ?.addEventListener("click", openCreatePlanModal);
          document.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document
                .querySelectorAll(".tab-btn")
                .forEach((b) =>
                  b.classList.remove(
                    "text-emerald-600",
                    "border-emerald-600",
                    "font-medium",
                    "border-b-2",
                  ),
                );
              btn.classList.add(
                "text-emerald-600",
                "border-b-2",
                "border-emerald-600",
                "font-medium",
              );
              switchTab(btn.dataset.tab);
            });
          });
          switchTab("plans");
          attachGlobalModalEvents();
        }

        function attachGlobalModalEvents() {
          // Record payment modal
          document
            .getElementById("closeRecordPaymentModal")
            ?.addEventListener("click", closeRecordPaymentModal);
          document
            .getElementById("cancelRecordPaymentBtn")
            ?.addEventListener("click", closeRecordPaymentModal);
          document
            .getElementById("recordPaymentForm")
            ?.addEventListener("submit", (e) => {
              e.preventDefault();
              if (!selectedPlanForAction) return;
              const amount = parseFloat(
                document.getElementById("paymentAmount").value,
              );
              const method = document.getElementById("paymentMethod").value;
              const ref = document.getElementById("paymentRef").value;
              if (isNaN(amount) || amount <= 0) {
                alert("Enter valid amount");
                return;
              }
              if (
                recordPayment(selectedPlanForAction.id, amount, method, ref)
              ) {
                alert(
                  `✅ Payment of ${formatCurrency(amount)} recorded for ${selectedPlanForAction.customer}`,
                );
                closeRecordPaymentModal();
                refreshUI();
              }
            });

          // Remind modal
          document
            .getElementById("closeRemindModal")
            ?.addEventListener("click", closeRemindModal);
          document
            .getElementById("cancelRemindBtn")
            ?.addEventListener("click", closeRemindModal);
          document
            .getElementById("sendReminderBtn")
            ?.addEventListener("click", () => {
              const msg = document.getElementById("reminderMessage").value;
              alert(
                `📱 Reminder sent to ${selectedPlanForAction?.customer}\nMessage: ${msg.substring(0, 100)}...`,
              );
              closeRemindModal();
            });

          // Create plan modal
          document
            .getElementById("closeCreatePlanModal")
            ?.addEventListener("click", closeCreatePlanModal);
          document
            .getElementById("cancelCreatePlanBtn")
            ?.addEventListener("click", closeCreatePlanModal);
          document
            .getElementById("createPlanForm")
            ?.addEventListener("submit", (e) => {
              e.preventDefault();
              const customerName = document
                .getElementById("planCustomerName")
                .value.trim();
              const orderId = document
                .getElementById("planOrderId")
                .value.trim();
              const totalAmount =
                document.getElementById("planTotalAmount").value;
              const installments =
                document.getElementById("planInstallments").value;
              const paymentMethod =
                document.getElementById("planPaymentMethod").value;
              const startDate = document.getElementById("planStartDate").value;
              if (!customerName || !orderId || !totalAmount) {
                alert("Please fill required fields");
                return;
              }
              const newPlan = createNewPlan({
                customerName,
                orderId,
                totalAmount,
                installments,
                paymentMethod,
                startDate,
                phone: "",
              });
              alert(
                `✅ Payment plan created for ${newPlan.customer}\nID: ${newPlan.id}\nInstallment: ${formatCurrency(newPlan.installmentAmount)} monthly`,
              );
              closeCreatePlanModal();
              refreshUI();
            });
        }

        function escapeHtml(str) {
          return String(str ?? "").replace(/[&<>]/g, (m) =>
            m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
          );
        }

        // Initialize
        function init() {
          const container = document.getElementById("lipaMdogoCoreRoot");
          container.innerHTML = renderMainUI();
          document
            .getElementById("createPlanBtn")
            ?.addEventListener("click", openCreatePlanModal);
          document.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document
                .querySelectorAll(".tab-btn")
                .forEach((b) =>
                  b.classList.remove(
                    "text-emerald-600",
                    "border-emerald-600",
                    "font-medium",
                    "border-b-2",
                  ),
                );
              btn.classList.add(
                "text-emerald-600",
                "border-b-2",
                "border-emerald-600",
                "font-medium",
              );
              switchTab(btn.dataset.tab);
            });
          });
          switchTab("plans");
          attachGlobalModalEvents();
        }

        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init);
        else init();
      })();
    </script>
  </body>
</html>
