<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Boy Alone | Transaction Hub </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      body {
        background: linear-gradient(135deg, #f0f4f8 0%, #e8edf3 100%);
      }
      .scrollbar-custom::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-custom::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .scrollbar-custom::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal-transition {
        transition: opacity 0.2s ease;
      }
    </style>
  </head>
  <body class="antialiased p-4 md:p-6">
    <!-- MAIN TRANSACTION HUB MODULE WRAPPER (fully independent, ready for Laravel blade include) -->
    <div id="transactionHubRoot" class="max-w-7xl mx-auto"></div>

    <!-- Add Transaction Modal -->
    <div
      id="manualTransactionModal"
      class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8 modal-transition"
    >
      <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 shadow-2xl">
        <div
          class="sticky top-0 bg-white border-b border-gray-100 px-6 py-5 rounded-t-2xl flex justify-between items-center"
        >
          <h3 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-plus-circle text-emerald-600 mr-2"></i>Add New
            Transaction
          </h3>
          <button
            id="closeManualModal"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="manualTransactionForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Reference Code <span class="text-red-500">*</span></label
                ><input
                  type="text"
                  id="transRefCode"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500"
                  placeholder="e.g., INV-001 / TRX-001"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Payment Method <span class="text-red-500">*</span></label
                ><select
                  id="transPaymentMethod"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="M-Pesa">M-Pesa</option>
                  <option value="Cash">Cash</option>
                  <option value="Airtel Money">Airtel Money</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Transaction Code</label
                ><input
                  type="text"
                  id="transCode"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Optional: M-Pesa ref / Cheque no."
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Amount (KES) <span class="text-red-500">*</span></label
                ><input
                  type="number"
                  id="transAmount"
                  required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="0.00"
                />
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Status <span class="text-red-500">*</span></label
                ><select
                  id="transStatus"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                >
                  <option value="Success">Success</option>
                  <option value="Pending">Pending</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Customer Name</label
                ><input
                  type="text"
                  id="transCustomer"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Customer name"
                />
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5"
                  >Notes</label
                ><textarea
                  id="transNotes"
                  rows="2"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl"
                  placeholder="Additional information"
                ></textarea>
              </div>
            </div>
            <div class="flex gap-3 justify-end pt-4">
              <button
                type="button"
                id="cancelManualBtn"
                class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 font-medium"
              >
                Cancel</button
              ><button
                type="submit"
                class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl hover:shadow-lg font-medium"
              >
                <i class="fas fa-check-circle mr-2"></i>Add Transaction
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Add Expense Modal -->
    <div
      id="expenseModal"
      class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 overflow-y-auto py-8 modal-transition"
    >
      <div class="bg-white rounded-2xl max-w-2xl w-full mx-4 shadow-2xl">
        <div class="px-6 py-5 border-b flex justify-between items-center">
          <h3 class="text-2xl font-bold">
            <i class="fas fa-chart-line text-red-600 mr-2"></i>Record Expense
          </h3>
          <button id="closeExpenseModal" class="text-gray-400">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <div class="p-6">
          <form id="expenseForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="text-sm font-semibold">Expense Category *</label
                ><select
                  id="expenseCategory"
                  class="w-full p-2.5 border rounded-xl"
                >
                  <option>Rent</option>
                  <option>Utilities</option>
                  <option>Inventory Purchase</option>
                  <option>Salary</option>
                  <option>Marketing</option>
                  <option>Maintenance</option>
                </select>
              </div>
              <div>
                <label>Amount (KES) *</label
                ><input
                  type="number"
                  id="expenseAmount"
                  required
                  class="w-full p-2.5 border rounded-xl"
                />
              </div>
              <div>
                <label>Date *</label
                ><input
                  type="date"
                  id="expenseDate"
                  class="w-full p-2.5 border rounded-xl"
                />
              </div>
              <div>
                <label>Payment Method</label
                ><select
                  id="expenseMethod"
                  class="w-full p-2.5 border rounded-xl"
                >
                  <option>Bank Transfer</option>
                  <option>Cash</option>
                  <option>M-Pesa</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label>Description</label
                ><textarea
                  id="expenseDesc"
                  rows="2"
                  class="w-full p-2.5 border rounded-xl"
                ></textarea>
              </div>
            </div>
            <div class="flex gap-3 justify-end">
              <button
                type="button"
                id="cancelExpenseBtn"
                class="px-6 py-2.5 border rounded-xl"
              >
                Cancel</button
              ><button
                type="submit"
                class="px-6 py-2.5 bg-red-600 text-white rounded-xl"
              >
                Add Expense
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // ==================== STANDALONE TRANSACTION HUB MODULE ====================
      // Focused on Success Transactions + Expenses (no collections dashboard)
      // Fully independent, can be dropped into Laravel blade or any project.

      (function () {
        // ---------- DATA ----------
        let successTransactions = [
          {
            id: "TXN-001",
            refCode: "INV-1001",
            paymentMethod: "M-Pesa",
            transCode: "QWK2L3M4",
            amount: 2075,
            status: "Success",
            customer: "Sarah Mwangi",
            date: "2026-04-11",
            notes: "Monthly installment",
          },
          {
            id: "TXN-002",
            refCode: "INV-1002",
            paymentMethod: "Cash",
            transCode: "",
            amount: 6500,
            status: "Success",
            customer: "John Kamau",
            date: "2026-04-10",
            notes: "Full payment",
          },
          {
            id: "TXN-003",
            refCode: "INV-1003",
            paymentMethod: "M-Pesa",
            transCode: "RTY9U7I6",
            amount: 1575,
            status: "Success",
            customer: "Grace Njeri",
            date: "2026-04-09",
            notes: "Installment #2",
          },
          {
            id: "TXN-004",
            refCode: "INV-1004",
            paymentMethod: "Airtel Money",
            transCode: "AIR123456",
            amount: 1689,
            status: "Success",
            customer: "Mary Wanjiku",
            date: "2026-04-08",
            notes: "Monthly payment",
          },
          {
            id: "TXN-005",
            refCode: "INV-1005",
            paymentMethod: "M-Pesa",
            transCode: "MPESA78JK",
            amount: 1083,
            status: "Success",
            customer: "Peter Omondi",
            date: "2026-04-05",
            notes: "Late payment",
          },
          {
            id: "TXN-006",
            refCode: "INV-1006",
            paymentMethod: "Bank Transfer",
            transCode: "BT98765",
            amount: 12500,
            status: "Success",
            customer: "David Otieno",
            date: "2026-04-12",
            notes: "Bulk order payment",
          },
        ];

        let expensesList = [
          {
            id: "EXP-001",
            category: "Rent",
            amount: 50000,
            date: "2026-04-01",
            method: "Bank Transfer",
            description: "April rent",
          },
          {
            id: "EXP-002",
            category: "Utilities",
            amount: 12500,
            date: "2026-04-05",
            method: "M-Pesa",
            description: "Electricity & water",
          },
          {
            id: "EXP-003",
            category: "Inventory Purchase",
            amount: 120000,
            date: "2026-04-03",
            method: "Bank Transfer",
            description: "New stock order",
          },
        ];

        function generateTransactionId() {
          return `TXN-${String(successTransactions.length + 101).padStart(3, "0")}`;
        }
        function formatCurrency(amount) {
          return new Intl.NumberFormat("en-KE", {
            style: "currency",
            currency: "KES",
            minimumFractionDigits: 0,
          }).format(amount);
        }
        function escapeHtml(str) {
          return String(str ?? "").replace(/[&<>]/g, (m) =>
            m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
          );
        }

        function calculateKPIs() {
          const totalTransactions = successTransactions.length;
          const totalCollected = successTransactions.reduce(
            (sum, t) => sum + t.amount,
            0,
          );
          const totalExpenses = expensesList.reduce(
            (sum, e) => sum + e.amount,
            0,
          );
          const netIncome = totalCollected - totalExpenses;
          const avgTransaction =
            totalTransactions > 0 ? totalCollected / totalTransactions : 0;
          const mpesaCount = successTransactions.filter(
            (t) => t.paymentMethod === "M-Pesa",
          ).length;
          const cashCount = successTransactions.filter(
            (t) => t.paymentMethod === "Cash",
          ).length;
          const bankCount = successTransactions.filter(
            (t) => t.paymentMethod === "Bank Transfer",
          ).length;
          const airtelCount = successTransactions.filter(
            (t) => t.paymentMethod === "Airtel Money",
          ).length;
          return {
            totalTransactions,
            totalCollected,
            totalExpenses,
            netIncome,
            avgTransaction,
            mpesaCount,
            cashCount,
            bankCount,
            airtelCount,
          };
        }

        // Render main UI
        function renderMainUI() {
          const kpis = calculateKPIs();
          return `
          <div class="space-y-6 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div><h1 class="text-3xl font-bold text-gray-800"><i class="fas fa-usd text-emerald-600 mr-2"></i>Transaction Hub</h1><p class="text-gray-500 mt-1">Manage success transactions & expenses</p></div>
              <div class="flex gap-2"><button id="manualTransBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-5 py-2.5 rounded-xl hover:shadow-lg flex items-center gap-2"><i class="fas fa-plus-circle"></i> New Transaction</button><button id="addExpenseBtn" class="bg-red-600 text-white px-5 py-2.5 rounded-xl hover:bg-red-700 flex items-center gap-2"><i class="fas fa-chart-line"></i> Add Expense</button></div>
            </div>
            
            <!-- KPI Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-emerald-600 mb-2"><i class="fas fa-check-circle"></i><p class="text-sm font-medium">Total Transactions</p></div><p class="text-2xl font-semibold">${kpis.totalTransactions}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-blue-600 mb-2"><i class="fas fa-dollar-sign"></i><p class="text-sm font-medium">Total Collected</p></div><p class="text-2xl font-semibold">${formatCurrency(kpis.totalCollected)}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-red-600 mb-2"><i class="fas fa-chart-line"></i><p class="text-sm font-medium">Total Expenses</p></div><p class="text-2xl font-semibold">${formatCurrency(kpis.totalExpenses)}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-purple-600 mb-2"><i class="fas fa-chart-simple"></i><p class="text-sm font-medium">Net Income</p></div><p class="text-2xl font-semibold ${kpis.netIncome >= 0 ? "text-purple-600" : "text-red-600"}">${formatCurrency(kpis.netIncome)}</p></div>
              <div class="bg-white rounded-xl border p-4 shadow-sm"><div class="flex items-center gap-2 text-amber-600 mb-2"><i class="fas fa-receipt"></i><p class="text-sm font-medium">Avg Transaction</p></div><p class="text-2xl font-semibold">${formatCurrency(Math.round(kpis.avgTransaction))}</p></div>
            </div>
            
            <!-- Payment Method Breakdown -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div class="bg-gradient-to-r from-green-50 to-green-100 rounded-xl p-3 border border-green-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-green-700"><i class="fab fa-m-pesa mr-1"></i> M-Pesa</span><span class="text-xl font-bold text-green-800">${kpis.mpesaCount}</span></div><p class="text-xs text-green-600 mt-1">transactions</p></div>
              <div class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl p-3 border border-gray-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-gray-700"><i class="fas fa-money-bill-wave mr-1"></i> Cash</span><span class="text-xl font-bold text-gray-800">${kpis.cashCount}</span></div><p class="text-xs text-gray-600">transactions</p></div>
              <div class="bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl p-3 border border-blue-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-blue-700"><i class="fas fa-university mr-1"></i> Bank Transfer</span><span class="text-xl font-bold text-blue-800">${kpis.bankCount}</span></div><p class="text-xs text-blue-600">transactions</p></div>
              <div class="bg-gradient-to-r from-purple-50 to-purple-100 rounded-xl p-3 border border-purple-200"><div class="flex items-center justify-between"><span class="text-sm font-medium text-purple-700"><i class="fas fa-mobile-alt mr-1"></i> Airtel Money</span><span class="text-xl font-bold text-purple-800">${kpis.airtelCount}</span></div><p class="text-xs text-purple-600">transactions</p></div>
            </div>
            
            <!-- Tabs -->
            <div class="border-b border-gray-200 flex gap-6"><button class="tab-btn pb-3 px-1 text-emerald-600 border-b-2 border-emerald-600 font-medium" data-tab="transactions">✅ Success Transactions</button><button class="tab-btn pb-3 px-1 text-gray-500 hover:text-gray-700" data-tab="expenses">📋 Expenses</button></div>
            <div id="tabContentContainer"></div>
          </div>
        `;
        }

        function renderTransactionsTab() {
          const kpis = calculateKPIs();
          return `
          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-200">
                  <tr><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Ref Code</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Method</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Trans Code</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Amount</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Status</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Customer</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Date</th><th class="px-5 py-3 text-left text-sm font-semibold text-gray-600">Action</th></tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  ${successTransactions
                    .map(
                      (txn) => `
                    <tr class="hover:bg-gray-50 transition">
                      <td class="px-5 py-3 font-medium text-gray-800">${escapeHtml(txn.refCode)}</td>
                      <td class="px-5 py-3"><span class="inline-flex px-2 py-1 bg-gray-100 rounded-lg text-xs">${escapeHtml(txn.paymentMethod)}</span></td>
                      <td class="px-5 py-3 text-gray-500 text-sm">${txn.transCode || "—"}</td>
                      <td class="px-5 py-3 font-semibold text-emerald-700">${formatCurrency(txn.amount)}</td>
                      <td class="px-5 py-3"><span class="inline-flex px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700"><i class="fas fa-check-circle mr-1 text-xs"></i>${txn.status}</span></td>
                      <td class="px-5 py-3 text-gray-700">${escapeHtml(txn.customer)}</td>
                      <td class="px-5 py-3 text-sm text-gray-500">${new Date(txn.date).toLocaleDateString()}</td>
                      <td class="px-5 py-3"><button class="deleteTxnBtn text-red-500 hover:text-red-700 transition" data-id="${txn.id}"><i class="fas fa-trash-alt"></i></button></td>
                    </tr>
                  `,
                    )
                    .join("")}
                  ${successTransactions.length === 0 ? '<tr><td colspan="8" class="text-center py-8 text-gray-400">No transactions recorded yet. Click "New Transaction" to add.</td></tr>' : ""}
                </tbody>
              </table>
            </div>
            <div class="bg-gray-50 px-5 py-3 border-t text-sm text-gray-500 flex justify-between items-center flex-wrap gap-2">
              <span><i class="fas fa-database mr-1"></i> ${successTransactions.length} successful transactions | Total: ${formatCurrency(kpis.totalCollected)}</span>
              <button id="exportTransactionsBtn" class="text-emerald-600 hover:text-emerald-700 transition"><i class="fas fa-download mr-1"></i> Export CSV</button>
            </div>
          </div>
        `;
        }

        function renderExpensesTab() {
          const totalExp = expensesList.reduce((s, e) => s + e.amount, 0);
          return `
          <div class="space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2"><h3 class="font-semibold text-lg">Expense History</h3><span class="text-red-600 font-bold">Total: ${formatCurrency(totalExp)}</span></div>
            <div class="bg-white border rounded-xl overflow-hidden">
              <table class="w-full">
                <thead class="bg-gray-50"><tr><th class="p-3 text-left">Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Method</th><th></th></tr></thead>
                <tbody>${expensesList.map((exp) => `<tr class="border-t"><td class="p-3">${new Date(exp.date).toLocaleDateString()}</td><td class="p-3"><span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs">${exp.category}</span></td><td class="p-3 text-gray-600">${exp.description}</td><td class="p-3 font-semibold text-red-600">${formatCurrency(exp.amount)}</td><td class="p-3 text-gray-500">${exp.method}</td><td class="p-3"><button class="deleteExpenseBtn text-red-500 hover:text-red-700" data-id="${exp.id}"><i class="fas fa-trash"></i></button></td></tr>`).join("")}</tbody>
              </table>
            </div>
            <button id="quickExpenseBtn" class="bg-red-600 text-white px-4 py-2 rounded-xl w-full mt-2 hover:bg-red-700 transition"><i class="fas fa-plus"></i> Quick Add Expense</button>
          </div>
        `;
        }

        function switchTab(tabId) {
          const container = document.getElementById("tabContentContainer");
          if (tabId === "transactions")
            container.innerHTML = renderTransactionsTab();
          else if (tabId === "expenses")
            container.innerHTML = renderExpensesTab();
          attachTabSpecificEvents(tabId);
        }

        function attachTabSpecificEvents(tabId) {
          if (tabId === "transactions") {
            document.querySelectorAll(".deleteTxnBtn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                const id = btn.dataset.id;
                if (
                  confirm(
                    "Delete this transaction? This action cannot be undone.",
                  )
                ) {
                  successTransactions = successTransactions.filter(
                    (t) => t.id !== id,
                  );
                  refreshUI();
                }
              });
            });
            const exportBtn = document.getElementById("exportTransactionsBtn");
            if (exportBtn) {
              exportBtn.addEventListener("click", () => {
                let csv =
                  "Ref Code,Payment Method,Trans Code,Amount,Status,Customer,Date,Notes\n" +
                  successTransactions
                    .map(
                      (t) =>
                        `"${t.refCode}","${t.paymentMethod}","${t.transCode || ""}",${t.amount},"${t.status}","${t.customer}","${t.date}","${t.notes || ""}"`,
                    )
                    .join("\n");
                const blob = new Blob([csv], { type: "text/csv" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "transactions_export.csv";
                a.click();
                URL.revokeObjectURL(url);
              });
            }
          }
          if (tabId === "expenses") {
            document.querySelectorAll(".deleteExpenseBtn").forEach((btn) => {
              btn.addEventListener("click", (e) => {
                const id = btn.dataset.id;
                if (confirm("Delete this expense?")) {
                  expensesList = expensesList.filter((e) => e.id !== id);
                  refreshUI();
                }
              });
            });
            const quickExpense = document.getElementById("quickExpenseBtn");
            if (quickExpense)
              quickExpense.addEventListener("click", () => openExpenseModal());
          }
        }

        function openAddTransactionModal() {
          document
            .getElementById("manualTransactionModal")
            .classList.remove("hidden");
          document
            .getElementById("manualTransactionModal")
            .classList.add("flex");
        }

        function closeAddTransactionModal() {
          document
            .getElementById("manualTransactionModal")
            .classList.add("hidden");
          document.getElementById("manualTransactionForm").reset();
        }

        function openExpenseModal() {
          document.getElementById("expenseModal").classList.remove("hidden");
          document.getElementById("expenseModal").classList.add("flex");
          document.getElementById("expenseDate").value = new Date()
            .toISOString()
            .slice(0, 10);
        }

        function closeExpenseModal() {
          document.getElementById("expenseModal").classList.add("hidden");
          document.getElementById("expenseForm").reset();
        }

        function addNewTransaction(formData) {
          const newTransaction = {
            id: generateTransactionId(),
            refCode: formData.refCode,
            paymentMethod: formData.paymentMethod,
            transCode: formData.transCode || "",
            amount: formData.amount,
            status: "Success",
            customer: formData.customer || "Walk-in Customer",
            date: new Date().toISOString().slice(0, 10),
            notes: formData.notes || "",
          };
          successTransactions.unshift(newTransaction);
          return newTransaction;
        }

        function addNewExpense(formData) {
          const newExpense = {
            id: `EXP-${String(expensesList.length + 101).padStart(3, "0")}`,
            category: formData.category,
            amount: formData.amount,
            date: formData.date,
            method: formData.method,
            description: formData.description,
          };
          expensesList.push(newExpense);
          return newExpense;
        }

        function refreshUI() {
          const container = document.getElementById("transactionHubRoot");
          container.innerHTML = renderMainUI();

          document
            .getElementById("manualTransBtn")
            ?.addEventListener("click", openAddTransactionModal);
          document
            .getElementById("addExpenseBtn")
            ?.addEventListener("click", openExpenseModal);

          const tabBtns = document.querySelectorAll(".tab-btn");
          tabBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              tabBtns.forEach((b) =>
                b.classList.remove(
                  "text-emerald-600",
                  "border-emerald-600",
                  "font-medium",
                  "border-b-2",
                ),
              );
              btn.classList.add(
                "text-emerald-600",
                "border-b-2",
                "border-emerald-600",
                "font-medium",
              );
              switchTab(btn.dataset.tab);
            });
          });
          switchTab("transactions");
          attachModalEvents();
        }

        function attachModalEvents() {
          // Transaction modal events
          document
            .getElementById("closeManualModal")
            ?.addEventListener("click", closeAddTransactionModal);
          document
            .getElementById("cancelManualBtn")
            ?.addEventListener("click", closeAddTransactionModal);
          document
            .getElementById("manualTransactionForm")
            ?.addEventListener("submit", (e) => {
              e.preventDefault();
              const refCode = document
                .getElementById("transRefCode")
                .value.trim();
              const paymentMethod =
                document.getElementById("transPaymentMethod").value;
              const transCode = document.getElementById("transCode").value;
              const amount = parseFloat(
                document.getElementById("transAmount").value,
              );
              const customer = document
                .getElementById("transCustomer")
                .value.trim();
              const notes = document.getElementById("transNotes").value;
              if (!refCode || isNaN(amount) || amount <= 0) {
                alert("Please provide valid Reference Code and Amount");
                return;
              }
              const newTxn = addNewTransaction({
                refCode,
                paymentMethod,
                transCode,
                amount,
                customer,
                notes,
              });
              alert(
                `✅ Transaction ${newTxn.refCode} added successfully! Amount: ${formatCurrency(amount)}`,
              );
              closeAddTransactionModal();
              refreshUI();
            });

          // Expense modal events
          document
            .getElementById("closeExpenseModal")
            ?.addEventListener("click", closeExpenseModal);
          document
            .getElementById("cancelExpenseBtn")
            ?.addEventListener("click", closeExpenseModal);
          document
            .getElementById("expenseForm")
            ?.addEventListener("submit", (e) => {
              e.preventDefault();
              const category = document.getElementById("expenseCategory").value;
              const amount = parseFloat(
                document.getElementById("expenseAmount").value,
              );
              const date =
                document.getElementById("expenseDate").value ||
                new Date().toISOString().slice(0, 10);
              const method = document.getElementById("expenseMethod").value;
              const description = document.getElementById("expenseDesc").value;
              if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount");
                return;
              }
              addNewExpense({ category, amount, date, method, description });
              alert(
                `✅ Expense of ${formatCurrency(amount)} recorded successfully!`,
              );
              closeExpenseModal();
              refreshUI();
            });

          // Click outside modals to close
          window.addEventListener("click", (e) => {
            const txnModal = document.getElementById("manualTransactionModal");
            const expModal = document.getElementById("expenseModal");
            if (e.target === txnModal) closeAddTransactionModal();
            if (e.target === expModal) closeExpenseModal();
          });
        }

        // Initialize
        function init() {
          const container = document.getElementById("transactionHubRoot");
          container.innerHTML = renderMainUI();
          document
            .getElementById("manualTransBtn")
            ?.addEventListener("click", openAddTransactionModal);
          document
            .getElementById("addExpenseBtn")
            ?.addEventListener("click", openExpenseModal);

          const tabBtns = document.querySelectorAll(".tab-btn");
          tabBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              tabBtns.forEach((b) =>
                b.classList.remove(
                  "text-emerald-600",
                  "border-emerald-600",
                  "font-medium",
                  "border-b-2",
                ),
              );
              btn.classList.add(
                "text-emerald-600",
                "border-b-2",
                "border-emerald-600",
                "font-medium",
              );
              switchTab(btn.dataset.tab);
            });
          });
          switchTab("transactions");
          attachModalEvents();
        }

        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init);
        else init();
      })();
    </script>
  </body>
</html>
